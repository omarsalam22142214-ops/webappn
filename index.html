<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقي الجديد</title>

    <!-- 1. ربط ملف تعريف التطبيق (المانيفست) -->
    <link rel="manifest" href="manifest.json">

    <!-- 2. تحديد لون شريط المتصفح من فوق في الموبايل -->
    <meta name="theme-color" content="#4CAF50">

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f9f9f9;
        }
        h1 { color: #4CAF50; }
    </style>
</head>
<body>

    <h1>أهلاً بيك في موقعي! 🚀</h1>
    <p>الموقع ده جاهز دلوقتي عشان يشتغل كأنه تطبيق موبايل (PWA).</p>

    <!-- 3. كود تشغيل التطبيق في الخلفية (Service Worker) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('التطبيق جاهز وشغال تمام!', reg))
                    .catch(err => console.log('في مشكلة:', err));
            });
        }
    </script>
</body>
</html>
